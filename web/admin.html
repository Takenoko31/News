<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理画面 - バケットリスト</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- ヘッダー -->
  <header class="bg-gray-800 text-white shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="index.html" class="text-sm text-gray-400 hover:text-white">&larr; サイト</a>
        <h1 class="text-lg font-bold">管理画面</h1>
      </div>
      <button id="logout-btn" class="text-sm text-gray-400 hover:text-white hidden">ログアウト</button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-6">

    <!-- ログインフォーム -->
    <section id="login-section" class="max-w-sm mx-auto bg-white rounded-xl shadow-sm p-6">
      <h2 class="text-lg font-semibold mb-4">管理者ログイン</h2>
      <form id="login-form" class="space-y-3">
        <input
          id="login-password"
          type="password"
          placeholder="パスワード"
          class="w-full border rounded-lg px-3 py-2 text-sm"
          required
        />
        <button type="submit" class="w-full bg-gray-800 hover:bg-gray-700 text-white text-sm font-medium px-4 py-2 rounded-lg">
          ログイン
        </button>
        <p id="login-error" class="text-red-500 text-sm hidden"></p>
      </form>
    </section>

    <!-- 管理パネル（ログイン後に表示） -->
    <section id="admin-panel" class="hidden space-y-6">

      <!-- タブ -->
      <div class="flex gap-1">
        <button class="admin-tab px-4 py-2 text-sm font-medium rounded-lg bg-gray-800 text-white" data-panel="reports-panel">通報一覧</button>
        <button class="admin-tab px-4 py-2 text-sm font-medium rounded-lg bg-gray-200 text-gray-700" data-panel="actions-panel">監査ログ</button>
      </div>

      <!-- 通報一覧 -->
      <div id="reports-panel" class="space-y-3">
        <div id="reports-list"></div>
        <button id="reports-more" class="text-sm text-blue-500 hover:text-blue-700 hidden">もっと読み込む</button>
        <div id="reports-loading" class="text-center hidden"><div class="spinner"></div></div>
        <p id="reports-empty" class="text-gray-400 text-sm text-center hidden">通報はありません</p>
      </div>

      <!-- 監査ログ -->
      <div id="actions-panel" class="hidden space-y-3">
        <div id="actions-list"></div>
        <button id="actions-more" class="text-sm text-blue-500 hover:text-blue-700 hidden">もっと読み込む</button>
        <p id="actions-empty" class="text-gray-400 text-sm text-center hidden">監査ログはありません</p>
      </div>
    </section>
  </main>

  <!-- BAN モーダル -->
  <div id="ban-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <h3 class="text-lg font-semibold mb-3">ユーザーBAN</h3>
      <form id="ban-form" class="space-y-3">
        <input type="hidden" id="ban-fingerprint" />
        <div>
          <label class="block text-sm text-gray-600 mb-1">BAN期間（日数）</label>
          <input id="ban-days" type="number" min="1" max="365" value="7" class="w-full border rounded-lg px-3 py-2 text-sm" required />
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">メモ（任意）</label>
          <input id="ban-note" type="text" maxlength="200" class="w-full border rounded-lg px-3 py-2 text-sm" />
        </div>
        <div class="flex gap-2 justify-end">
          <button type="button" id="ban-cancel" class="px-4 py-2 text-sm text-gray-600">キャンセル</button>
          <button type="submit" class="bg-red-600 hover:bg-red-700 text-white text-sm font-medium px-4 py-2 rounded-lg">BAN実行</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
